name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

env:
  PYTHON_VER: "3.12"

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
      prs_created: ${{ steps.release-please.outputs.prs_created }}
      pr: ${{ steps.release-please.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release-please
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release:
    name: Package and upload release archive
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VER }}

      - name: Package
        id: package
        run: |
          zip_path="$(scripts/package.sh "$RUNNER_TEMP/dist")"
          echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"

      - name: Upload archive to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" "${{ steps.package.outputs.zip_path }}" --clobber

      - name: Delete release PR pre-releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease) | .tagName' |
          while read -r tag; do
            gh release delete "$tag" --cleanup-tag --yes
          done

  prerelease:
    # Runs whenever release-please opens or updates its "chore(main): release x.y.z"
    # PR, so the upcoming release can be installed and tested before merging.
    name: Pre-release the release PR
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.prs_created == 'true' && needs.release-please.outputs.release_created != 'true' }}
    concurrency:
      group: prerelease
      cancel-in-progress: true
    steps:
      - name: Checkout release PR
        uses: actions/checkout@v4
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VER }}

      - name: Render README with the new changelog
        run: |
          python -m pip install --quiet readwright==0.5.0
          readwright render
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs: render README for release" README.md
            git push
          fi

      - name: Package
        id: package
        run: |
          version="$(jq -r .Version data/plugin.json)"
          echo "tag=v${version}-rc.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          zip_path="$(scripts/package.sh "$RUNNER_TEMP/dist")"
          echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"

      - name: Replace pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ fromJSON(needs.release-please.outputs.pr).number }}
          PR_BODY: ${{ fromJSON(needs.release-please.outputs.pr).body }}
          TAG: ${{ steps.package.outputs.tag }}
          ZIP_PATH: ${{ steps.package.outputs.zip_path }}
        run: |
          gh release list --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease) | .tagName' |
          while read -r tag; do
            gh release delete "$tag" --cleanup-tag --yes
          done

          notes="$RUNNER_TEMP/notes.md"
          printf 'Pre-release of #%s for testing. Install the zip manually; Flow Launcher will not offer it as an update.\n\n%s\n' \
            "$PR_NUMBER" "$PR_BODY" > "$notes"
          gh release create "$TAG" "$ZIP_PATH" \
            --prerelease \
            --target "$(git rev-parse HEAD)" \
            --title "$TAG" \
            --notes-file "$notes"
